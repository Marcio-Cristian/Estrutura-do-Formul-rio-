<!DOCTYPE html>

<html>
<head> <meta charset="utf-8">
	
	<title> Estrutura do Formulario </title> 
</head>
	
<body>
	
<form action="/pagina-processa-dados-do-form" method="post">
	
	  <fieldset>
		  <legend> Dados Gerais </legend>
		
	<label for="nome">Nome: 
		  </label>
	<input type="text" minlength="3" id="nome"/> 
	
	<label for="data-nascimento">Data de Nascimento:
		  </label>
	<input type="text" id="data-nascimento"/>
	
	<label for="cpf">CPF:
		  </label>
	<input type="cpf" minlength="11" id="cpf"/>
	  
	  </fieldset>
	
	  <fieldset>
		<legend> Endereço </legend>
	
	<label for="tipo-endereço">Tipo:
		  </label>
		<select id="tipo_endereço">
			<option 
					value="seleção">Selecione</option>
			<option value="">Rua</option>
			<option	value="">Estrada</option>	
			<option value="">Rodovia</option>
			<option	value="">Outros</option>
		</select>
	
	<label for="logradouro-endereço">Logradouro:
		  </label>
		<input type="text"
			   id="logradouro-endereço"/>
	<label for="numero-endereço">Numero:
		  </label>
		<input type="text"
			   id="numero-endereço"/>
	<label for="complemento-endereço">Complememto:
		  </label>
		<input type="text"
			   id="complemento-endereço"/>
	  </fieldset>	
	
	  <fieldset>
		  <legend> Fale Conosco </legend>
		  
	<label for="msg">Mensagem:
		  </label>
		<textarea type="text"
				  id="msg">
		  </textarea>
		  
	  </fieldset>
	
	  <fieldset>
	
	<button type="submit">Enviar sua mensagem
</button>
	<button type="reset">Limpar o Formulário
</button>
	
	  </fieldset>
	
	</form>
</body>
</html>
